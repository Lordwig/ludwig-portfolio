        <text x="110" y="0" font-weight="600" fill="#f8fafc">Amoxicillin Trihydrate (Himox)</text>
        <text x="360" y="0" fill="#94a3b8">500mg Capsule</text>
        <text x="500" y="0" font-weight="700" fill="#f8fafc">480 pcs</text>
        <text x="640" y="0" fill="#34d399">11 / 2026</text>
        <text x="760" y="0" font-weight="700" fill="#f8fafc">₱14.50</text>
      </g>
      <line x1="20" y1="105" x2="870" y2="105" stroke="#1e293b" stroke-width="1"/>

      <!-- Row 2 -->
      <g transform="translate(20, 140)" font-family="'Instrument Sans', sans-serif" font-size="13">
        <text x="0" y="0" font-family="monospace" font-weight="700" fill="#818cf8">MED-0102</text>
        <text x="110" y="0" font-weight="600" fill="#f8fafc">Paracetamol (Biogesic)</text>
        <text x="360" y="0" fill="#94a3b8">500mg Tablet</text>
        <text x="500" y="0" font-weight="700" fill="#f8fafc">920 pcs</text>
        <text x="640" y="0" fill="#34d399">08 / 2027</text>
        <text x="760" y="0" font-weight="700" fill="#f8fafc">₱8.25</text>
