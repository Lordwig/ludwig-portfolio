  <rect x="1000" y="18" width="165" height="34" rx="17" fill="#22c55e" fill-opacity="0.15"/>
  <circle cx="1015" cy="35" r="5" fill="#22c55e"/>
  <text x="1030" y="39" font-family="'Instrument Sans', sans-serif" font-size="12" font-weight="700" fill="#4ade80">File Storage Synced</text>

  <!-- Main Body Content -->
  <g transform="translate(280, 95)">
