<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="tsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#tsBgGrad)"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="250" height="750" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(24, 28)">
    <rect width="36" height="36" rx="8" fill="#3178c6"/>
    <text x="18" y="25" font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">TS</text>
    <text x="46" y="22" font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">EduTrack TS</text>
    <text x="46" y="34" font-family="'Instrument Sans', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">TYPESCRIPT SYSTEM</text>
  </g>

  <!-- Navigation -->
  <g transform="translate(18, 95)" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="600">
    <rect width="214" height="40" rx="8" fill="#27272a"/>
    <text x="36" y="25" fill="#f4f4f5">📚 Course Enrollments</text>

    <g transform="translate(0, 48)">
      <text x="36" y="25" fill="#a1a1aa">📝 Student Submissions</text>
    </g>
    <g transform="translate(0, 96)">
      <text x="36" y="25" fill="#a1a1aa">🧩 Generic Type Models</text>
    </g>
    <g transform="translate(0, 144)">
      <text x="36" y="25" fill="#a1a1aa">🛡️ Validation &amp; Enums</text>
    </g>
  </g>

  <!-- Header -->
  <rect x="250" y="0" width="950" height="70" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="280" y="42" font-family="'Instrument Sans', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Academic Submission &amp; Grading System</text>
  <rect x="990" y="18" width="180" height="34" rx="17" fill="#0284c7" fill-opacity="0.15"/>
  <circle cx="1005" cy="35" r="5" fill="#38bdf8"/>
  <text x="1020" y="39" font-family="'Instrument Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Strict Type Check OK</text>

  <!-- Main Body Content -->
  <g transform="translate(280, 95)">
    <!-- Metrics Row -->
    <g transform="translate(0, 0)">
      <rect width="285" height="85" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="18" y="28" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#a1a1aa">ACTIVE COURSES</text>
      <text x="18" y="58" font-family="'Instrument Sans', sans-serif" font-size="24" font-weight="700" fill="#f4f4f5">4 Curriculum Modules</text>
    </g>
    <g transform="translate(305, 0)">
      <rect width="285" height="85" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="18" y="28" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#a1a1aa">VERIFIED SUBMISSIONS</text>
      <text x="18" y="58" font-family="'Instrument Sans', sans-serif" font-size="24" font-weight="700" fill="#38bdf8">142 Entries Evaluated</text>
    </g>
    <g transform="translate(610, 0)">
      <rect width="280" height="85" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="18" y="28" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#a1a1aa">GENERIC MODELS</text>
      <text x="18" y="58" font-family="'Instrument Sans', sans-serif" font-size="24" font-weight="700" fill="#4ade80">100% Typed Safety</text>
    </g>

    <!-- Split Screen: Submissions Table & Code Structure -->
    <g transform="translate(0, 110)">
