      <rect width="520" height="490" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <path d="M0 0 h520 v42 h-520 z" fill="#09090b"/>
      <g transform="translate(18, 26)" font-family="'Instrument Sans', sans-serif" font-size="11" font-weight="700" fill="#a1a1aa">
        <text x="0" y="0">STUDENT</text>
        <text x="160" y="0">COURSE &amp; TASK</text>
        <text x="360" y="0">SCORE</text>
        <text x="440" y="0">STATUS</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(18, 75)" font-family="'Instrument Sans', sans-serif" font-size="13">
        <text x="0" y="0" font-weight="600" fill="#f4f4f5">Ludwig Rex Olarte</text>
        <text x="0" y="16" font-size="11" fill="#a1a1aa">ID: 2022-10901</text>
        <text x="160" y="0" fill="#38bdf8">Lab 4: Generic Repositories</text>
        <text x="160" y="16" font-size="11" fill="#71717a">CS-301 · TypeScript</text>
        <text x="360" y="8" font-weight="700" fill="#4ade80">100 / 100</text>
        <rect x="435" y="-6" width="65" height="20" rx="10" fill="#22c55e" fill-opacity="0.2"/>
        <text x="467" y="8" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">PASSED</text>
      </g>
      <line x1="18" y1="110" x2="502" y2="110" stroke="#27272a" stroke-width="1"/>

      <!-- Row 2 -->
      <g transform="translate(18, 145)" font-family="'Instrument Sans', sans-serif" font-size="13">
        <text x="0" y="0" font-weight="600" fill="#f4f4f5">Juan Carlos Santos</text>
        <text x="0" y="16" font-size="11" fill="#a1a1aa">ID: 2022-10814</text>
        <text x="160" y="0" fill="#38bdf8">Lab 4: Generic Repositories</text>
        <text x="160" y="16" font-size="11" fill="#71717a">CS-301 · TypeScript</text>
        <text x="360" y="8" font-weight="700" fill="#4ade80">96 / 100</text>
        <rect x="435" y="-6" width="65" height="20" rx="10" fill="#22c55e" fill-opacity="0.2"/>
        <text x="467" y="8" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">PASSED</text>
      </g>
      <line x1="18" y1="180" x2="502" y2="180" stroke="#27272a" stroke-width="1"/>

      <!-- Row 3 -->
      <g transform="translate(18, 215)" font-family="'Instrument Sans', sans-serif" font-size="13">
        <text x="0" y="0" font-weight="600" fill="#f4f4f5">Maria Elena Reyes</text>
        <text x="0" y="16" font-size="11" fill="#a1a1aa">ID: 2022-11029</text>
        <text x="160" y="0" fill="#38bdf8">Lab 3: Utility Types</text>
        <text x="160" y="16" font-size="11" fill="#71717a">IT-204 · Modeling</text>
        <text x="360" y="8" font-weight="700" fill="#4ade80">94 / 100</text>
        <rect x="435" y="-6" width="65" height="20" rx="10" fill="#22c55e" fill-opacity="0.2"/>
        <text x="467" y="8" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">PASSED</text>
      </g>
    </g>

    <!-- Right: TypeScript Generic Model Code Inspector -->
    <g transform="translate(545, 110)">
      <rect width="345" height="490" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <path d="M0 0 h345 v36 h-345 z" fill="#18181b"/>
      <text x="16" y="23" font-family="monospace" font-size="11" fill="#38bdf8">models/submission.types.ts</text>

      <!-- Code Syntax Highlighted lines -->
      <g transform="translate(16, 65)" font-family="monospace" font-size="11.5" line-height="1.6">
        <text x="0" y="0" fill="#c084fc">export interface</text>
        <text x="135" y="0" fill="#67e8f9">ISubmission</text>
        <text x="215" y="0" fill="#f4f4f5">&lt;T&gt; {</text>

        <text x="16" y="24" fill="#f4f4f5">id:</text>
        <text x="45" y="24" fill="#fdba74">string</text>
        <text x="90" y="24" fill="#f4f4f5">;</text>

        <text x="16" y="48" fill="#f4f4f5">studentId:</text>
        <text x="95" y="48" fill="#fdba74">string</text>
        <text x="140" y="48" fill="#f4f4f5">;</text>

        <text x="16" y="72" fill="#f4f4f5">courseCode:</text>
        <text x="105" y="72" fill="#fdba74">string</text>
        <text x="150" y="72" fill="#f4f4f5">;</text>

        <text x="16" y="96" fill="#f4f4f5">payload:</text>
        <text x="80" y="96" fill="#67e8f9">T</text>
        <text x="90" y="96" fill="#f4f4f5">;</text>

        <text x="16" y="120" fill="#f4f4f5">score:</text>
        <text x="65" y="120" fill="#fdba74">number</text>
        <text x="115" y="120" fill="#f4f4f5">;</text>

        <text x="16" y="144" fill="#f4f4f5">status:</text>
        <text x="75" y="144" fill="#4ade80">'pending'</text>
        <text x="145" y="144" fill="#f4f4f5">|</text>
        <text x="155" y="144" fill="#4ade80">'passed'</text>
        <text x="215" y="144" fill="#f4f4f5">;</text>

        <text x="0" y="172" fill="#f4f4f5">}</text>

        <text x="0" y="210" fill="#c084fc">export type</text>
        <text x="100" y="210" fill="#67e8f9">AcademicRecord</text>
        <text x="210" y="210" fill="#f4f4f5">=</text>
        <text x="16" y="234" fill="#c084fc">Readonly</text>
        <text x="78" y="234" fill="#f4f4f5">&lt;</text>
        <text x="88" y="234" fill="#67e8f9">ISubmission</text>
        <text x="168" y="234" fill="#f4f4f5">&lt;</text>
        <text x="178" y="234" fill="#fdba74">any</text>
        <text x="202" y="234" fill="#f4f4f5">&gt;&gt;;</text>
      </g>
    </g>
  </g>
</svg>

