    <rect x="250" y="190" width="96" height="30" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="298" y="210" font-family="'Instrument Sans', sans-serif" font-size="11.5" font-weight="700" fill="#fafaf9" text-anchor="middle">+ Add to Order</text>
  </g>

