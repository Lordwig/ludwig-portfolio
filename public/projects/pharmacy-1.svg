  </defs>

  <rect width="1200" height="750" fill="url(#rxBgGrad)"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="250" height="750" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(24, 28)">
    <rect width="36" height="36" rx="8" fill="#6366f1"/>
    <text x="18" y="25" font-family="'Instrument Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Rx</text>
    <text x="46" y="22" font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">MedTrack IMS</text>
    <text x="46" y="34" font-family="'Instrument Sans', sans-serif" font-size="10" font-weight="600" fill="#818cf8">C++ SYSTEM</text>
  </g>

  <!-- Sidebar Menu -->
  <g transform="translate(18, 95)" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="600">
    <rect width="214" height="40" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="36" y="25" fill="#c7d2fe">💊 Medicine Inventory</text>

    <g transform="translate(0, 48)">
      <text x="36" y="25" fill="#94a3b8">📋 Prescription Dispensing</text>
    </g>
    <g transform="translate(0, 96)">
      <text x="36" y="25" fill="#94a3b8">💳 POS &amp; Transactions</text>
    </g>
    <g transform="translate(0, 144)">
