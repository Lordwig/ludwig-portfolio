      <g transform="translate(14, 16)">
        <text x="0" y="14" font-family="'Instrument Sans', sans-serif" font-size="12" font-weight="800" fill="#f59e0b" letter-spacing="1">✦ AI SMART SUGGESTION</text>
        <text x="0" y="38" font-family="'Instrument Sans', sans-serif" font-size="12.5" fill="#fafaf9" font-weight="600">Frequently paired with Spanish Latte:</text>
        <text x="0" y="58" font-family="'Instrument Sans', sans-serif" font-size="12" fill="#a8a29e">Butter Croissant (+₱85.00)</text>
        <rect x="0" y="70" width="130" height="26" rx="6" fill="#f59e0b"/>
        <text x="65" y="87" font-family="'Instrument Sans', sans-serif" font-size="11" font-weight="700" fill="#1c1917" text-anchor="middle">Add Bundle (+₱85)</text>
      </g>
    </g>

    <!-- Active Live Order Queue -->
    <g transform="translate(18, 170)">
      <text x="0" y="16" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="700" fill="#fafaf9">Active Pre-Order Queue</text>
      
      <!-- Queue Item 1 -->
      <g transform="translate(0, 32)">
        <rect width="324" height="64" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1"/>
        <text x="14" y="24" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="700" fill="#fafaf9">Order #1042 · Ludwig O.</text>
        <text x="14" y="44" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#a8a29e">1x Iced Spanish Latte, 1x Butter Croissant</text>
        <rect x="226" y="14" width="84" height="20" rx="10" fill="#047857" fill-opacity="0.25"/>
        <text x="268" y="28" font-family="'Instrument Sans', sans-serif" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">PREPARING</text>
      </g>

      <!-- Queue Item 2 -->
      <g transform="translate(0, 106)">
        <rect width="324" height="64" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1"/>
        <text x="14" y="24" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="700" fill="#fafaf9">Order #1041 · Maria S.</text>
        <text x="14" y="44" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#a8a29e">2x Cold Brew Tonic · Pickup Ready</text>
        <rect x="226" y="14" width="84" height="20" rx="10" fill="#0284c7" fill-opacity="0.25"/>
        <text x="268" y="28" font-family="'Instrument Sans', sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">READY 📦</text>
      </g>

      <!-- Security / Performance Tag -->
      <g transform="translate(0, 190)">
        <rect width="324" height="80" rx="10" fill="#141210" stroke="#292524" stroke-width="1"/>
        <text x="14" y="24" font-family="'Instrument Sans', sans-serif" font-size="11" font-weight="700" fill="#a8a29e">SECURITY &amp; PERFORMANCE</text>
        <text x="14" y="44" font-family="'Instrument Sans', sans-serif" font-size="11.5" fill="#fafaf9">✓ JWT Session Control &amp; Rate-Limiting</text>
        <text x="14" y="64" font-family="'Instrument Sans', sans-serif" font-size="11.5" fill="#fafaf9">✓ MongoDB Aggregation Pipeline</text>
      </g>
    </g>
  </g>

  <!-- Bottom Drinks Row -->
  <g transform="translate(36, 474)">
    <rect width="360" height="244" rx="14" fill="url(#cardGrad)" stroke="#292524" stroke-width="1"/>
    <rect x="14" y="14" width="332" height="108" rx="10" fill="#292524"/>
    <text x="180" y="70" font-family="'Instrument Sans', sans-serif" font-size="36" text-anchor="middle">🥐</text>
    <text x="18" y="150" font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#fafaf9">Almond Butter Croissant</text>
    <text x="18" y="170" font-family="'Instrument Sans', sans-serif" font-size="12" fill="#a8a29e">Flaky layered pastry with roasted almond frangipane</text>
    <text x="18" y="218" font-family="'Instrument Sans', sans-serif" font-size="18" font-weight="800" fill="#f59e0b">₱95.00</text>
    <rect x="250" y="198" width="96" height="30" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="298" y="218" font-family="'Instrument Sans', sans-serif" font-size="11.5" font-weight="700" fill="#fafaf9" text-anchor="middle">+ Add to Order</text>
  </g>

  <g transform="translate(420, 474)">
    <rect width="360" height="244" rx="14" fill="url(#cardGrad)" stroke="#292524" stroke-width="1"/>
    <rect x="14" y="14" width="332" height="108" rx="10" fill="#292524"/>
    <text x="180" y="70" font-family="'Instrument Sans', sans-serif" font-size="36" text-anchor="middle">🍵</text>
    <text x="18" y="150" font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#fafaf9">Ceremonial Uji Matcha Latte</text>
    <text x="18" y="170" font-family="'Instrument Sans', sans-serif" font-size="12" fill="#a8a29e">Stone-ground Kyoto matcha with creamy oat milk</text>
    <text x="18" y="218" font-family="'Instrument Sans', sans-serif" font-size="18" font-weight="800" fill="#f59e0b">₱185.00</text>
    <rect x="250" y="198" width="96" height="30" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="298" y="218" font-family="'Instrument Sans', sans-serif" font-size="11.5" font-weight="700" fill="#fafaf9" text-anchor="middle">+ Add to Order</text>
  </g>
</svg>
