      <rect width="890" height="490" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <path d="M0 0 h890 v42 h-890 z" fill="#1e1b4b"/>
      <g transform="translate(20, 26)" font-family="'Instrument Sans', sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">
