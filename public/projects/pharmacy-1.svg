      <!-- Row 3 -->
      <g transform="translate(20, 205)" font-family="'Instrument Sans', sans-serif" font-size="13">
        <text x="0" y="0" font-family="monospace" font-weight="700" fill="#818cf8">MED-0205</text>
        <text x="110" y="0" font-weight="600" fill="#f8fafc">Cetirizine Hydrochloride</text>
        <text x="360" y="0" fill="#94a3b8">10mg Film-Coated Tab</text>
        <text x="500" y="0" font-weight="700" fill="#f8fafc">340 pcs</text>
        <text x="640" y="0" fill="#34d399">05 / 2026</text>
        <text x="760" y="0" font-weight="700" fill="#f8fafc">₱15.00</text>
      </g>
      <line x1="20" y1="235" x2="870" y2="235" stroke="#1e293b" stroke-width="1"/>

      <!-- Row 4 -->
      <g transform="translate(20, 270)" font-family="'Instrument Sans', sans-serif" font-size="13">
        <text x="0" y="0" font-family="monospace" font-weight="700" fill="#818cf8">MED-0340</text>
        <text x="110" y="0" font-weight="600" fill="#f8fafc">Losartan Potassium (Cozaar)</text>
        <text x="360" y="0" fill="#94a3b8">50mg Tablet</text>
        <text x="500" y="0" font-weight="700" fill="#f8fafc">610 pcs</text>
        <text x="640" y="0" fill="#34d399">02 / 2027</text>
        <text x="760" y="0" font-weight="700" fill="#f8fafc">₱18.75</text>
      </g>
      <line x1="20" y1="300" x2="870" y2="300" stroke="#1e293b" stroke-width="1"/>

      <!-- Row 5 -->
      <g transform="translate(20, 335)" font-family="'Instrument Sans', sans-serif" font-size="13">
        <text x="0" y="0" font-family="monospace" font-weight="700" fill="#818cf8">MED-0412</text>
        <text x="110" y="0" font-weight="600" fill="#f8fafc">Mefenamic Acid (Ponstan)</text>
        <text x="360" y="0" fill="#94a3b8">500mg Capsule</text>
        <text x="500" y="0" font-weight="700" fill="#f87171">18 pcs (Low)</text>
        <text x="640" y="0" fill="#f87171">10 / 2026</text>
        <text x="760" y="0" font-weight="700" fill="#f8fafc">₱19.50</text>
