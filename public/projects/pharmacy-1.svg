    <g transform="translate(0, 0)">
      <rect width="210" height="85" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="28" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#94a3b8">TOTAL MEDICINES</text>
      <text x="18" y="58" font-family="'Instrument Sans', sans-serif" font-size="24" font-weight="700" fill="#f8fafc">1,240 SKUs</text>
